openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AXF Security Interface API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: scan
    description: Security scanning
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/password:
    patch:
      operationId: changePassword
      tags: [auth]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/account:
    delete:
      operationId: deleteAccount
      tags: [auth]
      summary: Delete current user account
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /scan/summary:
    get:
      operationId: getScanSummary
      tags: [scan]
      summary: Get overall security scan summary
      responses:
        "200":
          description: Scan summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanSummary"

  /scan/repos:
    get:
      operationId: getRepos
      tags: [scan]
      summary: List repositories with security status
      responses:
        "200":
          description: Repository list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repo"

  /scan/alerts:
    get:
      operationId: getAlerts
      tags: [scan]
      summary: List recent security alerts
      responses:
        "200":
          description: Alert list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityAlert"

  /scan/sessions:
    get:
      operationId: getSessionReports
      tags: [scan]
      summary: List session reports
      responses:
        "200":
          description: Session report list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionReport"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    LoginInput:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    PasswordInput:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
      required:
        - currentPassword
        - newPassword

    AuthUser:
      type: object
      properties:
        id:
          type: number
        username:
          type: string
        createdAt:
          type: string
      required:
        - id
        - username
        - createdAt

    ScanSummary:
      type: object
      properties:
        totalRepos:
          type: number
        criticalCount:
          type: number
        highCount:
          type: number
        mediumCount:
          type: number
        lowCount:
          type: number
        lastScan:
          type: string
      required:
        - totalRepos
        - criticalCount
        - highCount
        - mediumCount
        - lowCount
        - lastScan

    Repo:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        url:
          type: string
        status:
          type: string
        alertCount:
          type: number
        lastChecked:
          type: string
      required:
        - id
        - name
        - url
        - status
        - alertCount
        - lastChecked

    SecurityAlert:
      type: object
      properties:
        id:
          type: number
        repoName:
          type: string
        severity:
          type: string
        title:
          type: string
        description:
          type: string
        cve:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - repoName
        - severity
        - title
        - description
        - cve
        - createdAt

    SessionReport:
      type: object
      properties:
        version:
          type: string
        title:
          type: string
        date:
          type: string
        path:
          type: string
      required:
        - version
        - title
        - date
        - path
